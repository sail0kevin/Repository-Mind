name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      REPOMIND_LLM_API_KEY: ""
      REPOMIND_EMBEDDING_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: backend/requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Install backend build dependencies
        shell: pwsh
        run: python -m pip install -r backend/requirements-build.txt

      - name: Verify stable product identity
        shell: pwsh
        run: ./scripts/verify_identity_contract.ps1

      - name: Verify locked build runtime
        shell: pwsh
        run: ./scripts/verify_runtime_contract.ps1 -PythonCommand python

      - name: Verify offline retrieval regression gate
        shell: pwsh
        run: python scripts/verify_retrieval_regression.py

      - name: Test release checksum verifier
        shell: pwsh
        run: ./scripts/test_release_hashes.ps1

      - name: Verify tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $package = Get-Content desktop/app/package.json -Raw | ConvertFrom-Json
          if ($tag -ne $package.version) { throw "Tag $tag does not match package version $($package.version)" }

      - name: Build and verify release artifacts
        shell: pwsh
        run: ./scripts/package_windows.ps1 -PythonCommand python -Release

      - name: Run packaged Electron E2E
        shell: pwsh
        run: ./scripts/e2e_windows.ps1 -ExePath ./desktop/app/release/win-unpacked/RepoMind.exe

      - name: Verify release hashes after E2E
        shell: pwsh
        run: ./scripts/verify_release_hashes.ps1 -ReleaseDirectory ./desktop/app/release

      - name: Upload redacted E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repomind-release-e2e-diagnostics
          path: |
            e2e-artifacts/**/*.png
            e2e-artifacts/**/*.zip
            e2e-artifacts/**/*.webm
            e2e-artifacts/**/*.txt
            e2e-artifacts/**/*-redacted.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repomind-windows-release
          path: |
            desktop/app/release/*.exe
            desktop/app/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/app/release/*.exe
            desktop/app/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
